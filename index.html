<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis - Gopal Edition</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
body { height: 100vh; overflow: hidden; font-family: Arial; }
.ai-bubble { background: #fff; padding: 12px; border-radius: 15px; }
.user-bubble { background: #2563eb; color: #fff; padding: 12px; border-radius: 15px; }
</style>
</head>

<body class="bg-gray-100">

<div class="flex h-full">

<!-- SIDEBAR -->
<div class="w-64 bg-white p-4 border-r">
    <button onclick="createNewChat()" class="bg-blue-600 text-white w-full p-2 rounded">New Chat</button>
    <div id="chat-list" class="mt-4 space-y-2"></div>
</div>

<!-- MAIN -->
<div class="flex-1 flex flex-col">

<div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

<div class="p-4 flex gap-2">
    <input id="user-input" class="flex-1 p-2 border rounded" placeholder="Ask Jarvis..." />
    <button onclick="toggleRobotMode()" class="bg-gray-200 px-3">🎤</button>
    <button onclick="sendMessage()" class="bg-blue-600 text-white px-4 rounded">Send</button>
</div>

</div>
</div>

<!-- SETTINGS -->
<div id="settings" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center">
<div class="bg-white p-6 rounded w-80">
    <input type="password" id="api-key" placeholder="Enter API Key" class="w-full p-2 border mb-3">
    <input type="text" id="model-id" value="google/gemma-4-31b-it:free" class="w-full p-2 border">
    <button onclick="saveSettings()" class="bg-blue-600 text-white w-full mt-3 p-2">Save</button>
</div>
</div>

<script>
let STATE = { chats: [], currentId: null, apiKey: '', model: 'google/gemma-4-31b-it:free', isRobotOn: false, isAITalking: false };

let recognition;
let isListening = false;
const synth = window.speechSynthesis;
let voices = [];

// Load voices properly
speechSynthesis.onvoiceschanged = () => {
    voices = speechSynthesis.getVoices();
};

window.onload = () => {
    const saved = JSON.parse(localStorage.getItem('jarvis')) || {};
    Object.assign(STATE, saved);

    document.getElementById('api-key').value = STATE.apiKey || '';
    document.getElementById('model-id').value = STATE.model;

    if (!STATE.currentId) createNewChat();
    initMic();
    refreshUI();
};

function initMic() {
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Speech) return;

    recognition = new Speech();
    recognition.lang = 'en-US';

    recognition.onstart = () => isListening = true;
    recognition.onend = () => isListening = false;

    recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        document.getElementById('user-input').value = text;
        sendMessage();
    };
}

function toggleRobotMode() {
    STATE.isRobotOn = !STATE.isRobotOn;

    if (!recognition) return;

    if (STATE.isRobotOn) {
        try { recognition.start(); } catch(e) {}
    } else {
        recognition.stop();
    }
}

async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();

    if (!text) return;

    if (!STATE.apiKey.trim()) {
        alert("Enter API key");
        return;
    }

    const chat = STATE.chats.find(c => c.id === STATE.currentId);
    if (!chat) return;

    chat.messages.push({ role: 'user', content: text });
    input.value = '';
    refreshUI();

    try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${STATE.apiKey}`
            },
            body: JSON.stringify({
                model: STATE.model,
                messages: [
                    { role: "system", content: "You are Jarvis. Be short and smart." },
                    ...chat.messages.slice(-10)
                ]
            })
        });

        if (!response.ok) {
            const err = await response.text();
            alert("API Error: " + err);
            return;
        }

        const data = await response.json();
        const aiMsg = data.choices?.[0]?.message;

        if (aiMsg) {
            chat.messages.push(aiMsg);
            refreshUI();
            speak(aiMsg.content);
        }

    } catch (e) {
        console.error(e);
    }
}

function speak(text) {
    synth.cancel();
    STATE.isAITalking = true;

    if (recognition) recognition.stop();

    const utter = new SpeechSynthesisUtterance(text);
    const isHindi = /[\u0900-\u097F]/.test(text);

    utter.voice = voices.find(v => v.lang.includes(isHindi ? 'hi' : 'en')) || voices[0];

    utter.onend = () => STATE.isAITalking = false;

    synth.speak(utter);
}

function refreshUI() {
    const list = document.getElementById('chat-list');
    list.innerHTML = STATE.chats.map(c => `
        <div onclick="switchChat('${c.id}')" class="p-2 border cursor-pointer">
            ${c.title || 'Chat'}
        </div>`).join('');

    const chat = STATE.chats.find(c => c.id === STATE.currentId);
    if (!chat) return;

    const container = document.getElementById('chat-container');

    container.innerHTML = chat.messages.map(m => `
        <div class="${m.role==='user'?'text-right':''}">
            <div class="${m.role==='user'?'user-bubble':'ai-bubble'}">
                ${marked.parse(m.content)}
            </div>
        </div>
    `).join('');

    container.scrollTop = container.scrollHeight;

    localStorage.setItem('jarvis', JSON.stringify(STATE));
}

function createNewChat() {
    const id = Date.now().toString();
    STATE.chats.unshift({ id, title: 'New Chat', messages: [] });
    STATE.currentId = id;
    refreshUI();
}

function switchChat(id) {
    STATE.currentId = id;
    refreshUI();
}

function saveSettings() {
    STATE.apiKey = document.getElementById('api-key').value;
    STATE.model = document.getElementById('model-id').value;
    document.getElementById('settings').classList.add('hidden');
    localStorage.setItem('jarvis', JSON.stringify(STATE));
}
</script>

</body>
</html>
