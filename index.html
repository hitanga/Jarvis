<script>
let STATE = { chats: [], currentId: null, apiKey: '', model: 'google/gemma-4-31b-it:free', isRobotOn: false, isAITalking: false };

let recognition;
let isListening = false;
const synth = window.speechSynthesis;
let voices = [];

// ✅ Load voices properly
speechSynthesis.onvoiceschanged = () => {
    voices = speechSynthesis.getVoices();
};

window.onload = () => {
    const saved = JSON.parse(localStorage.getItem('jarvis_v2')) || {};
    Object.assign(STATE, saved);

    document.getElementById('api-key').value = STATE.apiKey || '';
    document.getElementById('model-id').value = STATE.model || 'google/gemma-4-31b-it:free';

    if (!STATE.currentId || STATE.chats.length === 0) createNewChat();

    initMic();
    refreshUI();

    // Greeting
    const triggerGreeting = () => {
        speak("Hello Gopal! How can I help you?");
        document.removeEventListener('click', triggerGreeting);
    };
    document.addEventListener('click', triggerGreeting);
};

// ✅ FIXED MIC SETUP
function initMic() {
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!Speech) {
        console.warn("Speech Recognition not supported");
        return;
    }

    recognition = new Speech();

    recognition.lang = 'en-US';
    recognition.continuous = true; // 🔥 important
    recognition.interimResults = false;

    recognition.onstart = () => {
        isListening = true;
        updateStatus(true);
    };

    recognition.onend = () => {
        isListening = false;
        updateStatus(false);

        // 🔥 auto restart
        if (STATE.isRobotOn && !STATE.isAITalking) {
            try { recognition.start(); } catch(e) {}
        }
    };

    recognition.onerror = (e) => {
        console.error("Mic error:", e.error);

        if (STATE.isRobotOn) {
            try { recognition.start(); } catch(e) {}
        }
    };

    recognition.onresult = (e) => {
        const transcript = e.results[e.results.length - 1][0].transcript.trim();

        if (!transcript) return;

        // stop command
        if (STATE.isAITalking && /stop|bas|chup/i.test(transcript)) {
            stopSpeech();
            return;
        }

        document.getElementById('user-input').value = transcript;
        sendMessage();
    };
}

// ✅ FIXED ROBOT BUTTON
function toggleRobotMode() {
    STATE.isRobotOn = !STATE.isRobotOn;

    const btn = document.getElementById('robot-btn');
    const icon = document.getElementById('robot-icon');

    if (!recognition) return alert("Mic not supported");

    if (STATE.isRobotOn) {
        btn.className = "p-4 rounded-2xl bg-blue-600 text-white shadow-xl orb-active";
        icon.className = "fa-solid fa-microphone-lines text-2xl";

        try { recognition.start(); } catch(e) {}
    } else {
        btn.className = "p-4 rounded-2xl bg-slate-100 dark:bg-slate-700 text-slate-500";
        icon.className = "fa-solid fa-robot text-2xl";

        recognition.stop();
    }
}

// ❌ REMOVED setInterval (buggy)

async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();

    if (!text || STATE.isAITalking) return;

    if (!STATE.apiKey.trim()) {
        alert("Please enter API key");
        toggleSettings();
        return;
    }

    const chat = STATE.chats.find(c => c.id === STATE.currentId);
    if (!chat) return;

    if (chat.messages.length === 0) chat.title = text.substring(0, 25) + "...";

    chat.messages.push({ role: 'user', content: text });
    input.value = '';
    refreshUI();

    try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${STATE.apiKey.trim()}`
            },
            body: JSON.stringify({
                model: STATE.model.trim(),
                messages: [
                    { role: "system", content: "Your name is Jarvis. Be short and smart." },
                    ...chat.messages.slice(-8)
                ]
            })
        });

        if (!response.ok) {
            const err = await response.text();
            alert("API Error: " + err);
            return;
        }

        const data = await response.json();

        const aiMsg = data?.choices?.[0]?.message;

        if (aiMsg) {
            chat.messages.push(aiMsg);
            refreshUI();
            speak(aiMsg.content);
        }

    } catch (e) {
        console.error(e);
    }
}

// ✅ FIXED SPEAK FUNCTION
function speak(text) {
    synth.cancel();
    STATE.isAITalking = true;

    if (recognition) recognition.stop();

    const utterance = new SpeechSynthesisUtterance(text.replace(/[#*`]/g, ''));

    const isHindi = /[\u0900-\u097F]/.test(text);
    utterance.voice = voices.find(v => v.lang.includes(isHindi ? 'hi' : 'en')) || voices[0];

    utterance.onstart = () => {
        document.getElementById('stop-btn').classList.remove('hidden');
    };

    utterance.onend = () => {
        STATE.isAITalking = false;
        document.getElementById('stop-btn').classList.add('hidden');

        // 🔥 restart listening
        if (STATE.isRobotOn) {
            try { recognition.start(); } catch(e) {}
        }
    };

    synth.speak(utterance);
}

function stopSpeech() {
    synth.cancel();
    STATE.isAITalking = false;
    document.getElementById('stop-btn').classList.add('hidden');
}

function toggleDarkMode() {
    const isDark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

function updateStatus(listening) {
    const orb = document.getElementById('status-orb');

    orb.className = listening
        ? "w-3 h-3 rounded-full bg-blue-500 orb-active"
        : "w-3 h-3 rounded-full bg-slate-300 dark:bg-slate-600";

    document.getElementById('status-text').innerText = listening ? "Listening" : "Standby";
}

function refreshUI() {
    const list = document.getElementById('chat-list');

    list.innerHTML = STATE.chats.map(c => `
        <div onclick="switchChat('${c.id}')" class="p-3 mb-1 rounded-xl cursor-pointer ${c.id===STATE.currentId?'bg-blue-100 dark:bg-blue-900/40 text-blue-600 font-bold':'text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800'}">
            <span class="truncate text-xs">${c.title || 'Empty Chat'}</span>
        </div>
    `).join('');

    const chat = STATE.chats.find(c => c.id === STATE.currentId);
    const container = document.getElementById('chat-container');

    if (chat) {
        container.innerHTML = chat.messages.map(msg => `
            <div class="flex ${msg.role==='user'?'justify-end':'justify-start'}">
                <div class="max-w-[85%] p-4 ${msg.role==='user'?'user-bubble':'ai-bubble prose dark:prose-invert'}">
                    ${marked.parse(msg.content)}
                </div>
            </div>
        `).join('');

        container.scrollTop = container.scrollHeight;
    }

    localStorage.setItem('jarvis_v2', JSON.stringify(STATE));
}

function createNewChat() {
    const id = Date.now().toString();
    STATE.chats.unshift({ id, title: 'New Chat', messages: [] });
    STATE.currentId = id;
    refreshUI();
}

function switchChat(id) {
    STATE.currentId = id;
    refreshUI();
}

function toggleSettings() {
    document.getElementById('settings').classList.toggle('hidden');
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

function saveSettings() {
    STATE.apiKey = document.getElementById('api-key').value;
    STATE.model = document.getElementById('model-id').value;
    toggleSettings();
    localStorage.setItem('jarvis_v2', JSON.stringify(STATE));
}
</script>
