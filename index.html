<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis - Gopal Edition</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body { height: 100dvh; overflow: hidden; font-family: 'Inter', sans-serif; }
.ai-bubble { background: #fff; border-radius: 20px 20px 20px 0; padding: 12px; }
.user-bubble { background: #2563eb; color: #fff; border-radius: 20px 20px 0 20px; padding: 12px; }
.orb-active { box-shadow: 0 0 20px #3b82f6; }
</style>
</head>

<body class="bg-slate-50">

<div class="flex h-full">

<!-- Sidebar -->
<div class="w-64 bg-white border-r p-4">
    <button onclick="createNewChat()" class="w-full bg-blue-600 text-white p-2 rounded">New Chat</button>
    <div id="chat-list" class="mt-4 space-y-2"></div>
</div>

<!-- Main -->
<div class="flex-1 flex flex-col">

<header class="p-3 border-b flex justify-between">
    <div class="flex items-center gap-2">
        <div id="status-orb" class="w-3 h-3 bg-gray-300 rounded-full"></div>
        <span id="status-text" class="text-xs">Standby</span>
    </div>
    <button id="stop-btn" onclick="stopSpeech()" class="hidden bg-red-500 text-white px-2 text-xs rounded">STOP</button>
</header>

<div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

<div class="p-4 flex gap-2">
    <textarea id="user-input" class="flex-1 p-2 border rounded" placeholder="Ask Jarvis..."></textarea>
    <button id="robot-btn" onclick="toggleRobotMode()" class="px-3 bg-gray-200 rounded">
        <i id="robot-icon" class="fa-solid fa-robot"></i>
    </button>
    <button onclick="sendMessage()" class="bg-blue-600 text-white px-4 rounded">Send</button>
</div>

</div>
</div>

<!-- Settings -->
<div id="settings" class="fixed bottom-4 right-4">
    <input type="password" id="api-key" placeholder="API Key" class="p-2 border">
</div>

<script>
let STATE = {
    chats: [],
    currentId: null,
    apiKey: '',
    model: 'google/gemma-4-31b-it:free',
    isRobotOn: false,
    isAITalking: false
};

let recognition = null;
let isListening = false;
let voices = [];
const synth = window.speechSynthesis;

/* ---------- SAFE INIT ---------- */
window.addEventListener('DOMContentLoaded', () => {
    try {
        const saved = JSON.parse(localStorage.getItem('jarvis_v2')) || {};
        Object.assign(STATE, saved);
    } catch {}

    const apiInput = document.getElementById('api-key');
    if (apiInput) apiInput.value = STATE.apiKey || '';

    if (!STATE.currentId) createNewChat();

    initVoices();
    initMic();
    refreshUI();
});

/* ---------- VOICES ---------- */
function initVoices() {
    voices = synth.getVoices();
    if (!voices.length) {
        synth.onvoiceschanged = () => {
            voices = synth.getVoices();
        };
    }
}

/* ---------- MIC ---------- */
function initMic() {
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Speech) return;

    recognition = new Speech();
    recognition.lang = 'en-US';
    recognition.continuous = false;

    recognition.onstart = () => {
        isListening = true;
        updateStatus(true);
    };

    recognition.onend = () => {
        isListening = false;
        updateStatus(false);

        if (STATE.isRobotOn && !STATE.isAITalking) {
            setTimeout(() => safeStartMic(), 500);
        }
    };

    recognition.onerror = () => {
        if (STATE.isRobotOn) {
            setTimeout(() => safeStartMic(), 800);
        }
    };

    recognition.onresult = (e) => {
        const text = e.results[0][0].transcript.trim();
        if (!text) return;

        document.getElementById('user-input').value = text;
        sendMessage();
    };
}

function safeStartMic() {
    try {
        if (recognition && !isListening) recognition.start();
    } catch {}
}

/* ---------- TOGGLE MIC ---------- */
function toggleRobotMode() {
    STATE.isRobotOn = !STATE.isRobotOn;

    if (!recognition) return alert("Mic not supported");

    if (STATE.isRobotOn) {
        safeStartMic();
    } else {
        recognition.stop();
    }
}

/* ---------- SEND MESSAGE ---------- */
async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();

    if (!text || STATE.isAITalking) return;

    if (!STATE.apiKey.trim()) {
        alert("Enter API key");
        return;
    }

    const chat = STATE.chats.find(c => c.id === STATE.currentId);
    if (!chat) return;

    chat.messages.push({ role: 'user', content: text });
    input.value = '';
    refreshUI();

    try {
        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${STATE.apiKey}`
            },
            body: JSON.stringify({
                model: STATE.model,
                messages: [
                    { role: "system", content: "You are Jarvis. Be short and smart." },
                    ...chat.messages.slice(-10)
                ]
            })
        });

        if (!res.ok) throw new Error(await res.text());

        const data = await res.json();
        const aiMsg = data?.choices?.[0]?.message;

        if (aiMsg) {
            chat.messages.push(aiMsg);
            refreshUI();
            speak(aiMsg.content);
        }

    } catch (err) {
        console.error(err);
        alert("API Error");
    }
}

/* ---------- SPEAK ---------- */
function speak(text) {
    synth.cancel();
    STATE.isAITalking = true;

    if (recognition) recognition.stop();

    const utter = new SpeechSynthesisUtterance(text);
    utter.voice = voices[0];

    utter.onstart = () => {
        document.getElementById('stop-btn').classList.remove('hidden');
    };

    utter.onend = () => {
        STATE.isAITalking = false;
        document.getElementById('stop-btn').classList.add('hidden');

        if (STATE.isRobotOn) {
            setTimeout(() => safeStartMic(), 500);
        }
    };

    synth.speak(utter);
}

function stopSpeech() {
    synth.cancel();
    STATE.isAITalking = false;
}

/* ---------- UI ---------- */
function updateStatus(listening) {
    const orb = document.getElementById('status-orb');
    const text = document.getElementById('status-text');

    if (!orb || !text) return;

    orb.className = listening ? "w-3 h-3 bg-blue-500 rounded-full orb-active" : "w-3 h-3 bg-gray-300 rounded-full";
    text.innerText = listening ? "Listening" : "Standby";
}

function refreshUI() {
    const list = document.getElementById('chat-list');
    const container = document.getElementById('chat-container');

    if (!list || !container) return;

    list.innerHTML = STATE.chats.map(c =>
        `<div onclick="switchChat('${c.id}')" class="p-2 border cursor-pointer">${c.title || 'Chat'}</div>`
    ).join('');

    const chat = STATE.chats.find(c => c.id === STATE.currentId);
    if (!chat) return;

    container.innerHTML = chat.messages.map(m =>
        `<div class="${m.role==='user'?'text-right':''}">
            <div class="${m.role==='user'?'user-bubble':'ai-bubble'}">
                ${marked.parse(m.content)}
            </div>
        </div>`
    ).join('');

    container.scrollTop = container.scrollHeight;

    localStorage.setItem('jarvis_v2', JSON.stringify(STATE));
}

/* ---------- CHAT ---------- */
function createNewChat() {
    const id = Date.now().toString();
    STATE.chats.unshift({ id, title: 'New Chat', messages: [] });
    STATE.currentId = id;
    refreshUI();
}

function switchChat(id) {
    STATE.currentId = id;
    refreshUI();
}

/* ---------- SAVE API KEY ---------- */
document.getElementById('api-key').addEventListener('input', (e) => {
    STATE.apiKey = e.target.value;
    localStorage.setItem('jarvis_v2', JSON.stringify(STATE));
});
</script>

</body>
</html>
